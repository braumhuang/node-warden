name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm install

      - name: Create wrangler.toml with vars
        env:
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
        run: |
          # 1. 先写入通用的基础配置
          cat << EOF > wrangler.toml
          name = "${{ vars.WORKER_NAME }}"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"

          EOF

          # 2. 动态判断 WORKER_DOMAIN 是否配置，并追加对应的路由控制指令
          if [ -n "$WORKER_DOMAIN" ]; then
            echo "检测到配置了 WORKER_DOMAIN，启用自定义域名并关闭 workers.dev"
            cat << EOF >> wrangler.toml
          workers_dev = false
          preview_urls = false

          [[routes]]
          pattern = "$WORKER_DOMAIN"
          custom_domain = true
          EOF
          else
            echo "未检测到 WORKER_DOMAIN，启用默认的 workers.dev 和 preview_urls"
            cat << EOF >> wrangler.toml
          workers_dev = true
          preview_urls = true
          EOF
          fi

          # 3. 追加剩余的公开环境变量和 D1 数据库绑定
          cat << EOF >> wrangler.toml

          [build]
          command = "npm run build"

          [assets]
          binding = "ASSETS"
          directory = "./dist"
          html_handling = "none"
          not_found_handling = "single-page-application"
          run_worker_first = true

          [triggers]
          crons = [ "*/5 * * * *" ]

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ vars.D1_NAME }}"

          [[durable_objects.bindings]]
          name = "NOTIFICATIONS_HUB"
          class_name = "NotificationsHub"

          [[durable_objects.bindings]]
          name = "BACKUP_TRANSFER_RUNNER"
          class_name = "BackupTransferRunner"

          [[r2_buckets]]
          binding = "ATTACHMENTS"
          bucket_name = "${{ vars.R2_NAME }}"

          [[migrations]]
          tag = "v1-notifications-hub"
          new_sqlite_classes = [ "NotificationsHub" ]

          [[migrations]]
          tag = "v2-backup-transfer-runner"
          new_sqlite_classes = [ "BackupTransferRunner" ]
          EOF

      - name: Deploy Worker & Set Secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          secrets: |
            JWT_SECRET
          command: deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
